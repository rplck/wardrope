function rng(i){const a=CR[i.cat],b=SR[i.season]||[-40,45],lo=Math.max(a[0],b[0]),hi=Math.min(a[1],b[1]);return lo<=hi?[lo,hi]:a}

function gen(t,rain){
  const need=['top','bottom','shoes'];if(t<13||(rain&&t<18))need.unshift('outer');
  const sc=i=>{let s=-fitd(i,t)*2+(i.fav?1:0)+(i.wears?0:.5);const l=lastW(i.id);if(l!=null&&l<3)s-=2;return s};
  const pool=s=>S.items.filter(i=>!i.laundry&&slotOf(i.cat)===s&&fitd(i,t)<=4).sort((a,b)=>sc(b)-sc(a));
  const missing=need.filter(s=>!pool(s).length);
  if(missing.length)return{list:[],missing};
  const PL={};SLOTS.forEach(s=>PL[s]=pool(s).slice(0,4));
  const seen=new Set(),out=[],recent=new Set(S.history.filter(h=>Date.now()-new Date(h.date+'T12:00').getTime()<6048e5).map(h=>h.sig));
  for(let n=0;n<50&&out.length<6;n++){
    const c=[];
    for(const s of SLOTS){const p=PL[s];if(!p.length)continue;
      if(s==='outer'&&!need.includes('outer')&&(t>=18||n%2))continue;
      if(s==='acc'&&n&&Math.random()<.4)continue;
      c.push(p[n?Math.floor(Math.random()**2*p.length):0])}
    const sig=c.map(i=>i.id).sort().join();if(seen.has(sig))continue;seen.add(sig);
    const cl=new Set(c.map(i=>i.color).filter(x=>!NEUT.includes(x)));
    let s=c.reduce((a,i)=>a+sc(i),0)-3*Math.max(0,cl.size-1)-(recent.has(sig)?5:0);
    out.push({items:c,s});
  }
  out.sort((a,b)=>b.s-a.s);
  return{list:out,missing:[]};
}
function why(c,t,rain){

  const o=c.items.find(i=>slotOf(i.cat)==='outer');
  if(o)p.push(`«${o.name}» защитит от прохлады.`);else if(t>=13)p.push('Верхняя одежда не нужна.');
  const cl=new Set(c.items.map(i=>i.color).filter(x=>!NEUT.includes(x)));
  p.push(cl.size?`Цветовой акцент: ${[...cl].join(', ').toLowerCase()}.`:'Спокойная палитра, цвета хорошо сочетаются.');
  const old=c.items.find(i=>!i.wears||(lastW(i.id)||0)>14);

  return p.join(' ');
}

const WAIST={XS:[27,29],S:[29,31],M:[31,33],L:[33,35],XL:[35,38],XXL:[38,42]};
function sizeOk(r,cat,z){

  const num=parseFloat(raw.replace(/[^\d.]/g,''));
  if(cat==='Обувь'){if(!z.shoe||!num)return null;const us=z.shoe-33;return Math.abs(num-us)<=.5||(/EU/.test(raw)&&Math.abs(num-z.shoe)<=.5)}

  if(['Брюки','Джинсы'].includes(cat)&&num>=24&&z.bot){const w=WAIST[z.bot];return num>=w[0]&&num<=w[1]}
  return z.top?L.split(/[\s\/,]+/).includes(z.top):null;
}

function vToday(){

  if(!d){
    wc=`<div class="c"><h2>Погода недоступна</h2><p class="sub">${WS==='load'?'Загружаем данные…':WS==='deny'?'Не удалось определить местоположение. Разрешите доступ к геолокации и нажмите «Обновить» или выберите город в настройках.':'Не удалось получить актуальную погоду, сохранённых данных нет. Введите температуру на улице вручную.'}</p>
    <div class="row" style="margin-top:12px"><input class="in" id="mt" type="number" inputmode="numeric" placeholder="Температура, °C" style="width:170px"><button class="b" data-a="man">Применить</button><button class="b g" data-a="refresh">${I('ref',16)}Обновить</button></div></div>`;
  }else{
    const t=effT(d);
    const note=d.man?'Температура введена вручную':WS==='cache'?`Нет сети. Данные от ${hhmm(WX.at)}, могут быть неточными`:`Open-Meteo, обновлено ${hhmm(WX.at)}`;
    wc=`<div class="c"><div class="row sp"><div><div class="sub">${E(cname())}</div><div class="tmp">${Math.round(d.t)}°</div>${d.man?'':`<div class="sub">Ощущается как ${Math.round(d.f)}°</div>`}</div>
    <button class="b g sm" data-a="refresh">${I('ref',15)}Обновить</button></div>
    ${d.man?'':`<div class="hero" style="margin-top:14px"><div><b>${Math.round(d.w)} км/ч</b><div class="l">Ветер</div></div><div><b>${d.hum}%</b><div class="l">Влажность</div></div><div><b>${d.pp}%</b><div class="l">Осадки (макс.)</div></div></div>
    <div class="hero" style="margin-top:12px">${[2,5,8].map(i=>d.hrs[i]).filter(Boolean).map(h=>`<div><b>${Math.round(h.t)}°</b><div class="l">В ${h.h}:00</div></div>`).join('')}</div>`}
    <p class="sub" style="font-size:12px;margin-top:12px">${note}</p></div>`;
    const rain=d.pr>0||d.pp>=50;
    if(!S.items.length)oc=`<div class="c">${empty('shirt','Гардероб пуст. Добавьте вещи, и мы подберём образ на сегодня.',`<button class="b" data-a="go" data-id="wardrobe">Открыть гардероб</button>`)}</div>`;
    else{
      if(!G||G.t!==t)G={t,idx:0,...gen(t,rain)};
      if(G.missing.length)oc=`<div class="c"><h2>Образ на сегодня</h2><p>Не хватает: <b>${G.missing.map(s=>SN[s].toLowerCase()).join(', ')}</b>. В гардеробе нет подходящих вещей для ${t}°C (в стирке вещи не учитываются).</p></div>`;
      else{const c=G.list[G.idx%G.list.length];
        oc=`<div class="c"><div class="row sp"><h2 style="margin:0">Образ на сегодня</h2><span class="sub">${G.idx%G.list.length+1} из ${G.list.length}</span></div>
        <div class="gr" style="margin:14px 0;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">${c.items.map(i=>`<div>${thumb(i)}<div class="sub" style="font-size:12px;margin-top:4px">${SN[slotOf(i.cat)]}: ${E(i.name)}</div></div>`).join('')}</div>
        <p class="sub">${E(why(c,t,rain))}</p>
        <div class="row" style="margin-top:14px"><button class="b" data-a="wearG">${I('check',16)}Надеть</button><button class="b g" data-a="saveG">Сохранить</button><button class="b g" data-a="next">Другой образ</button></div></div>`;}
    }
  }
  return`<h1>${greet()}</h1><p class="sub" style="margin:6px 0 22px;text-transform:capitalize">${date}</p>${oc}${wc}${vParams()}${vShop()}${vLaundry()}`;
}

  const so={new:(x,y)=>y.created-x.created,name:(x,y)=>x.name.localeCompare(y.name,'ru'),price:(x,y)=>(y.price||0)-(x.price||0),wears:(x,y)=>y.wears-x.wears};

const shrink=u=>new Promise(res=>{if(!/^data:/.test(u||''))return res(u||'');const im=new Image();im.onload=()=>{const k=Math.min(1,320/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.6))};im.onerror=()=>res('');im.src=u});

async function saveWish(id){
  const name=$('#wn').value.trim();if(!name)return toast('Введите название');
  const img=await shrink(PH),p=parseFloat($('#wp').value),u=$('#wu').value.trim();
  const d={name,brand:$('#wb').value.trim(),size:$('#wsz').value.trim(),price:p>0?p:null,url:u&&!/^https?:\/\//i.test(u)?'https://'+u:u,img,note:$('#wz').value.trim()};
  if(id)Object.assign(WL().find(x=>x.id===id),d);else WL().unshift({id:uid(),added:Date.now(),cur:'₸',...d});
  save();closeM();render();toast('Сохранено в вишлист');
}

function bars(o){const m=Math.max(1,...Object.values(o));const e=Object.entries(o).filter(x=>x[1]);return e.length?e.map(([k,v])=>`<div class="bar"><span>${k}</span><i style="width:${v/m*55}%"></i><span style="color:var(--t)">${v}</span></div>`).join(''):'<p class="sub">Нет данных</p>'}
function vStats(){
  const it=S.items;if(!it.length)return`<h1 style="margin-bottom:16px">Аналитика</h1>${empty('chart','Добавьте вещи, чтобы увидеть статистику.')}`;
  const pr=it.filter(i=>i.price>0),val=pr.reduce((a,i)=>a+i.price,0);
  const cc={},sc={};CATS.forEach(c=>cc[c]=it.filter(i=>i.cat===c).length);SEAS.forEach(s=>sc[s]=it.filter(i=>i.season===s).length);
  const worn=[...it].sort((a,b)=>b.wears-a.wears).filter(i=>i.wears>0).slice(0,5),least=[...it].sort((a,b)=>a.wears-b.wears).slice(0,5);
  const cpw=pr.filter(i=>i.wears>0).map(i=>({i,v:i.price/i.wears})).sort((a,b)=>a.v-b.v);
  const li=(i,r)=>`<div class="li" style="cursor:default" ><div style="flex:1">${E(i.name)}</div><span class="sub">${r}</span></div>`;
  return`<h1 style="margin-bottom:16px">Аналитика</h1><div class="kp"><div class="c"><b>${it.length}</b><span class="sub">Всего вещей</span></div><div class="c"><b>${pr.length?money(val):'—'}</b><span class="sub">Стоимость гардероба</span></div><div class="c"><b>${S.history.length}</b><span class="sub">Надето образов</span></div></div>
  <div class="c"><h2>По категориям</h2>${bars(cc)}</div><div class="c"><h2>По сезонам</h2>${bars(sc)}</div>
  <div class="c"><h2>Чаще всего носите</h2>${worn.length?worn.map(i=>li(i,i.wears+' раз')).join(''):'<p class="sub">Пока нет данных о носке.</p>'}</div>
  <div class="c"><h2>Реже всего носите</h2>${least.map(i=>li(i,i.wears+' раз')).join('')}</div>
  <div class="c"><h2>Стоимость одного использования</h2><p class="sub" style="margin-bottom:6px">Цена вещи, делённая на число использований. Вещи без цены или без носки не учитываются.</p>${cpw.length?cpw.map(x=>li(x.i,money(x.v))).join(''):'<p class="sub">Укажите цену у вещей и отмечайте образы кнопкой «Надеть».</p>'}</div>`;
}

function landing(){return`<div class="lp"><header class="row sp"><b style="letter-spacing:.04em">WARDROBE OS</b><button class="b g sm" data-a="lg" data-id="in">Войти</button></header>
  <section class="h1"><div class="sub ey">ЦИФРОВОЙ ГАРДЕРОБ</div><h1 class="big">WARDROBE OS</h1><p class="sub ld">Вся одежда в одном месте. Образы под погоду, история носки и понятная аналитика.</p>
  <div class="row" style="justify-content:center"><button class="b" data-a="lg" data-id="up" style="padding:14px 28px;font-size:16px">Создать аккаунт</button><button class="b g" data-a="lg" data-id="in" style="padding:14px 28px;font-size:16px">Войти</button></div></section>
  <section class="g3">${lpc('Весь гардероб','Фото, категории, бренды и цены. Каждая вещь на своём месте и всегда под рукой.')}${lpc('Образы на сегодня','Подбор по погоде вашего города: что надеть, чтобы не замёрзнуть и не перегреться.')}${lpc('Аналитика','Что вы носите чаще всего, что лежит без дела и сколько стоит одно использование вещи.')}</section>
  <section class="ab"><h2>Кто мы</h2><p class="sub">Мы делаем простые инструменты для повседневной жизни. WARDROBE OS нужен, чтобы утром не тратить время на выбор одежды, а вещи не копились без дела. Без лишнего: личный аккаунт, ваши данные, ваш гардероб на любом устройстве.</p></section>
  <footer class="sub">© WARDROBE OS</footer></div>`}
function render(){
  const N=[['today','Сегодня','sun'],['wardrobe','Гардероб','shirt'],['outfits','Образы','layers'],['stats','Аналитика','chart'],['set','Настройки','set']];
  if(!AR){$('#app').innerHTML='';return}
  if(!AU){$('#app').innerHTML=landing();return}
  if(!S.name){$('#app').innerHTML=`<main style="margin:0"><div class="wrap" style="max-width:420px;padding-top:12vh"><h1>WARDROBE OS</h1><p class="sub" style="margin:8px 0 24px">Ваш личный гардероб. Как вас зовут?</p><input class="in" id="nm" placeholder="Имя" autocomplete="given-name"><button class="b" data-a="start" style="margin-top:14px">Начать</button></div></main>`;return}
  const v={today:vToday,wardrobe:vWardrobe,outfits:vOutfits,stats:vStats,set:vSet}[V]();
  $('#app').innerHTML=`<nav><div class="br">WARDROBE OS</div>${N.map(n=>`<button class="${n[0]===V?'on ':''}${n[0]==='set'?'set':''}" data-a="go" data-id="${n[0]}">${I(n[2],22)}${n[1]}</button>`).join('')}</nav><main><div class="wrap${V!==LV?' pg':''}">${v}</div></main>`;LV=V;
}

/* ---------- Формы ---------- */
const sel=(id,a,v)=>`<select class="in" id="${id}">${a.map(x=>`<option${x===v?' selected':''}>${E(x)}</option>`).join('')}</select>`;
function openItem(id){
  const i=id?gI(id):{name:'',cat:'Футболки',color:'Чёрный',season:'Всесезонный',brand:'',price:'',tags:[],notes:'',fav:false,laundry:false,photo:'',url:''};
  PH=i.photo;if(!id){FMODE='pick';FS={q:'',list:[],st:'',note:''}}
  modal(`<h2>${id?'Редактировать вещь':'Новая вещь'}</h2><div id="pv">${PH?`<img class="ph" style="max-height:220px;width:auto;margin:auto" src="${PH}" alt="">`:''}</div>
  ${id?'':`<label class="lb">Найти вещь на Grailed</label><div class="row" style="flex-wrap:nowrap"><input class="in" id="fq" placeholder="Например: stone island hoodie"><button class="b" data-a="fsrch">Найти</button></div><div class="row" style="margin-top:8px"><span class="sub" style="font-size:13px">Размер:</span>${szSel()}</div><div id="fres">${fresHTML()}</div><p class="sub" style="font-size:12px;margin-top:10px">Или заполните вручную ниже.</p>`}
  <label class="lb">Фото</label><input type="file" accept="image/*" id="fi" class="in">
  <label class="lb">Название</label><input class="in" id="fn" value="${E(i.name)}">
  <div class="r2"><div><label class="lb">Категория</label>${sel('fc',CATS,i.cat)}</div><div><label class="lb">Цвет</label>${sel('fo',Object.keys(COLS),i.color)}</div></div>
  <div class="r2"><div><label class="lb">Сезон</label>${sel('fs',SEAS,i.season)}</div><div><label class="lb">Цена, ₸</label><input class="in" id="fp" type="number" inputmode="decimal" value="${i.price||''}"></div></div>
  <label class="lb">Бренд</label><input class="in" id="fb" value="${E(i.brand)}">
  <label class="lb">Теги через запятую</label><input class="in" id="ft" value="${E(i.tags.join(', '))}">
  <label class="lb">Ссылка на товар</label><input class="in" id="fu" type="url" placeholder="https://www.grailed.com/listings/..." value="${E(i.url||'')}">${/^https?:/.test(i.url||'')?`<a class="sub" style="font-size:13px" target="_blank" rel="noopener" href="${E(i.url)}">Открыть в магазине</a>`:''}
  <label class="lb">Ссылка на фото (необязательно)</label><input class="in" id="fph" type="url" placeholder="https://..." value="${/^https?:/.test(i.photo||'')?E(i.photo):''}">
  <label class="lb">Заметки</label><textarea class="in" id="fz" rows="2">${E(i.notes)}</textarea>
  <div class="row" style="margin:14px 0"><label><input type="checkbox" id="ff"${i.fav?' checked':''}> Избранное</label><label><input type="checkbox" id="fl"${i.laundry?' checked':''}> В стирке</label></div>
  <div class="row"><button class="b" data-a="saveI" data-id="${id||''}">Сохранить</button><button class="b g" data-a="cl">Отмена</button>${id?`<button class="b g" data-a="delI" data-id="${id}">${I('trash',16)}Удалить</button>`:''}</div>`);
}
function saveItem(id){
  const name=$('#fn').value.trim();if(!name)return toast('Введите название вещи');
  const p=parseFloat($('#fp').value);
  const d={name,cat:$('#fc').value,color:$('#fo').value,season:$('#fs').value,price:p>0?p:null,brand:$('#fb').value.trim(),tags:$('#ft').value.split(',').map(x=>x.trim()).filter(Boolean),notes:$('#fz').value.trim(),fav:$('#ff').checked,laundry:$('#fl').checked,photo:PH,url:(u=>u&&!/^https?:\/\//i.test(u)?'https://'+u:u)($('#fu').value.trim())};
  if(id)Object.assign(gI(id),d);else S.items.push({id:uid(),wears:0,created:Date.now(),...d});
  G=null;save();closeM();render();toast('Вещь сохранена');
}
function openOutfit(id){
  const o=id?S.outfits.find(x=>x.id===id):{name:'',ids:[]};
  const cur=s=>(o.ids.map(gI).find(i=>i&&slotOf(i.cat)===s)||{}).id;
  modal(`<h2>${id?'Изменить образ':'Новый образ'}</h2><label class="lb">Название</label><input class="in" id="on" value="${E(o.name)}" placeholder="Например, рабочий день">
  ${SLOTS.map(s=>`<label class="lb">${SN[s]}</label><select class="in" id="sl-${s}"><option value="">Не выбрано</option>${S.items.filter(i=>slotOf(i.cat)===s).map(i=>`<option value="${i.id}"${i.id===cur(s)?' selected':''}>${E(i.name)}${i.laundry?' (в стирке)':''}</option>`).join('')}</select>`).join('')}
  <div class="row" style="margin-top:18px"><button class="b" data-a="saveO" data-id="${id||''}">Сохранить</button><button class="b g" data-a="cl">Отмена</button></div>`);
}
function saveOutfit(id){
  const ids=SLOTS.map(s=>$('#sl-'+s).value).filter(Boolean);
  const miss=['top','bottom','shoes'].filter(s=>!$('#sl-'+s).value);
  if(miss.length)return toast('Добавьте в образ: '+miss.map(s=>SN[s].toLowerCase()).join(', '));
  const name=$('#on').value.trim()||'Образ от '+new Date().toLocaleDateString('ru-RU');
  if(id){Object.assign(S.outfits.find(x=>x.id===id),{name,ids})}else S.outfits.unshift({id:uid(),name,ids,fav:false});
  save();closeM();render();toast('Образ сохранён');
}
function backup(){
  modal(`<h2>Резервная копия</h2><p class="sub">Скопируйте текст, чтобы сохранить данные, или вставьте ранее сохранённую копию и нажмите «Восстановить».</p><textarea class="in" id="bk" rows="8" style="margin:12px 0;font-size:12px">${E(JSON.stringify(S))}</textarea>
  <input type="file" accept=".json,.txt" id="bf" class="in" style="margin-bottom:12px"><div class="row"><button class="b" data-a="copy">Копировать</button><button class="b g" data-a="restore">Восстановить</button><button class="b g" data-a="cl">Закрыть</button></div>`);
}

/* ---------- События ---------- */
document.addEventListener('click',e=>{
  if(e.target.classList.contains('ov'))return closeM();
  const a=e.target.closest('[data-a]');if(!a)return;e.stopPropagation();
  const id=a.dataset.id,k=a.dataset.a;
  const d=wd(),c=G&&G.list&&G.list.length?G.list[G.idx%G.list.length]:null;
  const A={
    lg(){authModal(id)},swm(){authModal(AM==='up'?'in':'up')},sub:submit,gg:google,fg:forgot,out(){sync().then(()=>auth.signOut())},
    start(){const v=$('#nm').value.trim();if(!v)return toast('Введите имя');S.name=v;save();render();loadW()},
    go(){V=id;render();window.scrollTo(0,0)},
    cl:closeM,yes(){closeM();CB&&CB();CB=null},
    refresh(){loadW()},
    srch(){runSearch($('#sq').value)},
    sgo(){$('#sq').value=id;runSearch(id,a.dataset.c);$('#sq').scrollIntoView({block:'center',behavior:'smooth'})},
    addR(){const r=RS.list.find(x=>String(x.id)===id);if(!r)return;const t=r.title.toLowerCase(),col=Object.keys(CEN).find(k=>t.includes(CEN[k]))||'Другой';
      S.items.push({id:uid(),wears:0,created:Date.now(),name:r.title,cat:guessCat(t+' '+RS.q,RS.cat),color:col,season:'Всесезонный',price:null,brand:r.brand||'',tags:[],notes:'Grailed, $'+Math.round(r.price)+(r.size?', размер '+r.size:''),fav:false,laundry:false,photo:r.img,url:r.url});
      G=null;save();toast('Добавлено в гардероб. Категорию и цену можно поправить в «Гардеробе»')},
    sq(){shopGo(+id,'sq')},fq(){shopGo(+id,'fq')},
    fsrch(){fSearch($('#fq').value)},
    pick(){const r=FS.list.find(x=>String(x.id)===id);if(!r)return;const t=r.title.toLowerCase(),col=Object.keys(CEN).find(k=>t.includes(CEN[k]))||'Другой';
      $('#fn').value=r.title;$('#fc').value=guessCat(t+' '+FS.q,'Футболки');if([...$('#fo').options].some(o=>o.value===col))$('#fo').value=col;$('#fb').value=r.brand||'';$('#fu').value=r.url||'';$('#fph').value=r.img||'';$('#fz').value='Grailed, $'+Math.round(r.price)+(r.size?', размер '+r.size:'');
      PH=r.img||'';$('#pv').innerHTML=PH?`<img class="ph" style="max-height:220px;width:auto;margin:auto" src="${E(PH)}" alt="" referrerpolicy="no-referrer">`:'';document.querySelector('.md').scrollTo({top:0,behavior:'smooth'});toast('Вещь выбрана. Проверьте данные и нажмите «Сохранить»')},
    lnAdd(){const a=S.items.filter(i=>!i.laundry);if(!a.length)return toast('Нет вещей, которые можно добавить');modal(`<h2>Что в стирку?</h2><div style="margin:8px 0 16px">${a.map(i=>`<label class="li" style="cursor:pointer"><input type="checkbox" class="ln" value="${i.id}">${thumb(i)}<span style="flex:1">${E(i.name)}</span></label>`).join('')}</div><div class="row"><button class="b" data-a="lnSave">Добавить</button><button class="b g" data-a="cl">Отмена</button></div>`)},
    lnSave(){const ids=[...document.querySelectorAll('.ln:checked')].map(x=>x.value);if(!ids.length)return toast('Выберите вещи');ids.forEach(x=>{gI(x).laundry=true});G=null;save();closeM();render();toast('Добавлено в стирку: '+ids.length)},
    lnBack(){const i=gI(id);i.laundry=false;G=null;save();render();toast('Вещь снова доступна',()=>{i.laundry=true;G=null;save();render()})},
    lnAll(){S.items.forEach(i=>i.laundry=false);G=null;save();render();toast('Всё постирано')},
    man(){const v=parseFloat($('#mt').value);if(isNaN(v))return toast('Введите число, например 12');MAN=v;G=null;render()},
    next(){G.idx++;render()},
    wearG(){c&&wear(c.items.map(i=>i.id))},
    saveG(){if(!c)return;S.outfits.unshift({id:uid(),name:'Образ от '+new Date().toLocaleDateString('ru-RU'),ids:c.items.map(i=>i.id),fav:false});save();toast('Образ сохранён')},
    add(){openItem()},edit(){openItem(id)},
    fav(){const i=gI(id);i.fav=!i.fav;G=null;save();$('#wl')?$('#wl').innerHTML=wlist():render()},
    vw(){W.view=W.view==='grid'?'list':'grid';render()},
    saveI(){saveItem(id)},
    delI(){ask('Удалить вещь? Она также исчезнет из сохранённых образов.',()=>{S.items=S.items.filter(x=>x.id!==id);S.outfits.forEach(o=>o.ids=o.ids.filter(x=>x!==id));G=null;save();render();toast('Вещь удалена')})},
    tab(){OT=id;render()},newW(){openWish()},wEdit(){openWish(id)},saveW(){saveWish(id)},
    wadd(){const r=FS.list.find(x=>String(x.id)===id);if(!r)return;if(WL().some(w=>w.url&&w.url===r.url))return toast('Уже в вишлисте');
      WL().unshift({id:uid(),added:Date.now(),name:r.title,brand:r.brand||'',size:r.size||'',price:r.price||null,cur:'$',url:r.url||'',img:r.img||'',note:'Grailed'});
      save();const e=$('#wlst');if(e)e.innerHTML=wishListHTML();toast('Добавлено в вишлист')},
    wDel(){ask('Удалить из вишлиста?',()=>{S.wish=WL().filter(x=>x.id!==id);save();const e=$('#wlst');if(e)e.innerHTML=wishListHTML();toast('Удалено')})},
    wBuy(){const w=WL().find(x=>x.id===id);if(!w)return;const t=w.name.toLowerCase(),col=Object.keys(CEN).find(k=>t.includes(CEN[k]))||'Другой';
      S.items.push({id:uid(),wears:0,created:Date.now(),name:w.name,cat:guessCat(t,'Футболки'),color:col,season:'Всесезонный',price:null,brand:w.brand||'',tags:[],notes:w.note||'',fav:false,laundry:false,photo:w.img||'',url:w.url||''});
      S.wish=WL().filter(x=>x.id!==id);G=null;save();render();toast('Перенесено в гардероб')},
    newO(){openOutfit()},editO(){openOutfit(id)},saveO(){saveOutfit(id)},
    favO(){const o=S.outfits.find(x=>x.id===id);o.fav=!o.fav;save();render()},
    wearO(){const o=S.outfits.find(x=>x.id===id);if(o.ids.some(x=>gI(x)&&gI(x).laundry))return toast('В образе есть вещь в стирке');wear(o.ids)},
    delO(){ask('Удалить образ?',()=>{S.outfits=S.outfits.filter(x=>x.id!==id);save();render()})},
    undo(){undo(id)},bk:backup,
    copy(){const t=$('#bk');t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('Скопировано')).catch(()=>{document.execCommand&&document.execCommand('copy');toast('Скопировано')})},
    restore(){try{const j=JSON.parse($('#bk').value);if(!Array.isArray(j.items))throw 0;ask('Текущие данные будут заменены. Продолжить?',()=>{S=migrate(j);G=null;save();applyTheme();render();toast('Данные восстановлены')})}catch(x){toast('Неверный формат резервной копии')}},
    reset(){ask('Удалить все вещи, образы и историю? Это действие нельзя отменить.',()=>{S={v:3,name:S.name,theme:S.theme,city:S.city,items:[],outfits:[],history:[]};G=null;save();render();toast('Данные удалены')})}
  };
  A[k]&&A[k]();
});
document.addEventListener('change',e=>{
  if(!e.target.classList.contains('szo'))return;SZO=e.target.value;
  document.querySelectorAll('.szo').forEach(x=>x.value=SZO);
  if($('#fres')&&FS.q)fSearch(FS.q);else if($('#sres')&&RS.q)runSearch(RS.q,RS.cat);
});
document.addEventListener('input',e=>{
  if(e.target.id==='wq'){W.q=e.target.value;$('#wl').innerHTML=wlist()}
  else if((e.target.id||'').startsWith('p-')){const p=S.params||(S.params={});p[e.target.id.slice(2)]=e.target.value;$('#psz').innerHTML=psHTML();$('#shp').innerHTML=shopBody();save()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='wc'){W.cat=t.value;$('#wl').innerHTML=wlist()}
  else if(t.id==='ws'){W.sort=t.value;$('#wl').innerHTML=wlist()}
  else if(t.id==='sn'){S.name=t.value.trim()||S.name;save();toast('Имя сохранено')}
  else if(t.id==='st'){S.theme=t.value;applyTheme();save()}
  else if(t.id==='sc'){S.city=t.value==='auto'?'auto':+t.value;MAN=null;save();loadW()}
  else if(t.id==='fi'&&t.files[0]){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);PH=c.toDataURL('image/jpeg',.78);$('#pv').innerHTML=`<img class="ph" style="max-height:220px;width:auto;margin:auto" src="${PH}" alt="">`};im.onerror=()=>toast('Не удалось открыть изображение');im.src=r.result};r.readAsDataURL(t.files[0])}
  else if(t.id==='fph'){const u=t.value.trim();PH=/^https?:\/\//.test(u)?u:'';$('#pv').innerHTML=PH?`<img class="ph" style="max-height:220px;width:auto;margin:auto" src="${E(PH)}" alt="" onerror="this.remove()">`:''}
  else if(t.id==='bf'&&t.files[0]){const r=new FileReader();r.onload=()=>{$('#bk').value=r.result};r.readAsText(t.files[0])}
});
setInterval(()=>{if(V==='today'&&S.name&&!$('#mo').innerHTML&&!document.activeElement.matches('input,textarea'))render()},60000);

/* ---------- Автообновление погоды ---------- */
const busy=()=>document.activeElement&&document.activeElement.matches('input,textarea,select');
setInterval(()=>{if(S.name&&MAN==null&&!busy())loadW()},18e5);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.name&&MAN==null&&!busy()&&(!WX||Date.now()-WX.at>12e5))loadW()});
/* ---------- Запуск ---------- */
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ap')submit();if(e.key==='Enter'&&e.target.id==='sq')runSearch(e.target.value);if(e.key==='Enter'&&e.target.id==='fq')fSearch(e.target.value)});
auth.onAuthStateChanged(async u=>{
  AU=u;OK=false;S=blank();SV={};G=null;WX=null;V='today';
  if(u){try{await loadUser()}catch(e){toast('Не удалось загрузить данные. Проверьте правила Firestore и сеть');OK=false}}
  AR=true;closeM();applyTheme();render();if(u&&S.name)loadW();
});
</script>
