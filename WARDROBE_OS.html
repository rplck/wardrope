async function place(){

  if(GEO&&Date.now()-GEO.at<36e5)return GEO;

    const c=j.current,h=j.hourly,k=Math.max(0,h.time.findIndex(t=>t.slice(0,13)>=c.time.slice(0,13)));
    const hs=h.time.slice(k,k+10).map((t,n)=>({h:+t.slice(11,13),t:h.temperature_2m[k+n],f:h.apparent_temperature[k+n],p:h.precipitation_probability[k+n]||0,r:h.precipitation[k+n]||0}));
    WX={city:S.city,name:p.name,at:Date.now(),cur:{t:c.temperature_2m,f:c.apparent_temperature,hum:c.relative_humidity_2m,w:c.wind_speed_10m,pr:c.precipitation||0},hrs:hs};
    WS='ok';kvset('wx',WX).catch(()=>{});
  }catch(e){const c0=await kvget('wx').catch(()=>null);
    if(c0&&c0.cur&&c0.city===S.city&&Date.now()-c0.at<108e5){WX=c0;WS='cache'}else{WX=null;WS=e&&e.code==='no_geo'?'deny':'none'}}
  G=null;render();
}
function wd(){
  if(WX&&WX.cur){const c=WX.cur,n=WX.hrs;
    return{t:c.t,f:c.f,hum:c.hum,w:c.w,pr:c.pr,pp:Math.max(0,...n.map(x=>x.p)),hrs:n,min:Math.min(c.f,...n.slice(0,6).map(x=>x.f))}}
  if(MAN!=null)return{t:MAN,f:MAN,man:1,pr:0,pp:0};
  return null;
}
const effT=d=>d.hrs?Math.round(Math.min(d.f,(d.f+d.min)/2)):Math.round(d.f);
const hhmm=ts=>new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});

/* ---------- Подбор образов ---------- */
function rng(i){const a=CR[i.cat],b=SR[i.season]||[-40,45],lo=Math.max(a[0],b[0]),hi=Math.min(a[1],b[1]);return lo<=hi?[lo,hi]:a}
function fitd(i,t){const r=rng(i);return t<r[0]?r[0]-t:t>r[1]?t-r[1]:0}
function lastW(id){const h=S.history.find(x=>x.ids.includes(id));return h?Math.floor((Date.now()-new Date(h.date+'T12:00').getTime())/864e5):null}
function gen(t,rain){
  const need=['top','bottom','shoes'];if(t<13||(rain&&t<18))need.unshift('outer');
  const sc=i=>{let s=-fitd(i,t)*2+(i.fav?1:0)+(i.wears?0:.5);const l=lastW(i.id);if(l!=null&&l<3)s-=2;return s};
  const pool=s=>S.items.filter(i=>!i.laundry&&slotOf(i.cat)===s&&fitd(i,t)<=4).sort((a,b)=>sc(b)-sc(a));
  const missing=need.filter(s=>!pool(s).length);
  if(missing.length)return{list:[],missing};
  const PL={};SLOTS.forEach(s=>PL[s]=pool(s).slice(0,4));
  const seen=new Set(),out=[],recent=new Set(S.history.filter(h=>Date.now()-new Date(h.date+'T12:00').getTime()<6048e5).map(h=>h.sig));
  for(let n=0;n<50&&out.length<6;n++){
    const c=[];
    for(const s of SLOTS){const p=PL[s];if(!p.length)continue;
      if(s==='outer'&&!need.includes('outer')&&(t>=18||n%2))continue;
      if(s==='acc'&&n&&Math.random()<.4)continue;
      c.push(p[n?Math.floor(Math.random()**2*p.length):0])}
    const sig=c.map(i=>i.id).sort().join();if(seen.has(sig))continue;seen.add(sig);
    const cl=new Set(c.map(i=>i.color).filter(x=>!NEUT.includes(x)));
    let s=c.reduce((a,i)=>a+sc(i),0)-3*Math.max(0,cl.size-1)-(recent.has(sig)?5:0);
    out.push({items:c,s});
  }
  out.sort((a,b)=>b.s-a.s);
  return{list:out,missing:[]};
}
function why(c,t,rain){
  const p=[`Эффективная температура около ${t}°C с учётом вечера`+(rain?', возможны осадки':'')+'.'];
  const o=c.items.find(i=>slotOf(i.cat)==='outer');
  if(o)p.push(`«${o.name}» защитит от прохлады.`);else if(t>=13)p.push('Верхняя одежда не нужна.');
  const cl=new Set(c.items.map(i=>i.color).filter(x=>!NEUT.includes(x)));
  p.push(cl.size?`Цветовой акцент: ${[...cl].join(', ').toLowerCase()}.`:'Спокойная палитра, цвета хорошо сочетаются.');
  const old=c.items.find(i=>!i.wears||(lastW(i.id)||0)>14);
  if(old)p.push(`Вещь «${old.name}» давно не использовалась.`);
  return p.join(' ');
}

function wear(ids){
  const sig=[...ids].sort().join(),d=day();
  if(S.history.some(h=>h.date===d&&h.sig===sig))return toast('Этот образ уже отмечен сегодня');
  const h={id:uid(),date:d,sig,ids:[...ids]};S.history.unshift(h);
  ids.forEach(id=>{const i=S.items.find(x=>x.id===id);if(i)i.wears++});
  save();G=G&&{...G};toast('Образ записан в историю',()=>undo(h.id));render();
}
function undo(hid){
  const k=S.history.findIndex(h=>h.id===hid);if(k<0)return;
  const h=S.history.splice(k,1)[0];
  h.ids.forEach(id=>{const i=S.items.find(x=>x.id===id);if(i&&i.wears>0)i.wears--});
  save();toast('Запись отменена');render();
}
function toast(m,fn){

  if(fn){const b=document.createElement('button');b.textContent='Отменить';b.onclick=()=>{fn();d.remove()};d.appendChild(b)}
  $('#ts').appendChild(d);setTimeout(()=>d.remove(),5000);
}

        <p class="sub">${E(why(c,t,rain))}</p>
        <div class="row" style="margin-top:14px"><button class="b" data-a="wearG">${I('check',16)}Надеть</button><button class="b g" data-a="saveG">Сохранить</button><button class="b g" data-a="next">Другой образ</button></div></div>`;}
    }
  }
  return`<h1>${greet()}</h1><p class="sub" style="margin:6px 0 22px;text-transform:capitalize">${date}</p>${oc}${wc}`;

  if(!S.name){$('#app').innerHTML=`<main style="margin:0"><div class="wrap" style="max-width:420px;padding-top:12vh"><h1>WARDROBE OS</h1><p class="sub" style="margin:8px 0 24px">Ваш личный гардероб. Как вас зовут?</p><input class="in" id="nm" placeholder="Имя" autocomplete="given-name"><button class="b" data-a="start" style="margin-top:14px">Начать</button></div></main>`;return}
  const v={today:vToday,wardrobe:vWardrobe,outfits:vOutfits,stats:vStats,set:vSet}[V]();
  $('#app').innerHTML=`<nav><div class="br">WARDROBE OS</div>${N.map(n=>`<button class="${n[0]===V?'on ':''}${n[0]==='set'?'set':''}" data-a="go" data-id="${n[0]}">${I(n[2],22)}${n[1]}</button>`).join('')}</nav><main><div class="wrap">${v}</div></main>`;
}

/* ---------- Формы ---------- */
const sel=(id,a,v)=>`<select class="in" id="${id}">${a.map(x=>`<option${x===v?' selected':''}>${E(x)}</option>`).join('')}</select>`;
function openItem(id){
  const i=id?gI(id):{name:'',cat:'Футболки',color:'Чёрный',season:'Всесезонный',brand:'',price:'',tags:[],notes:'',fav:false,laundry:false,photo:''};
  PH=i.photo;
  modal(`<h2>${id?'Редактировать вещь':'Новая вещь'}</h2><div id="pv">${PH?`<img class="ph" style="max-height:220px;width:auto;margin:auto" src="${PH}" alt="">`:''}</div>
  <label class="lb">Фото</label><input type="file" accept="image/*" id="fi" class="in">
  <label class="lb">Название</label><input class="in" id="fn" value="${E(i.name)}">
  <div class="r2"><div><label class="lb">Категория</label>${sel('fc',CATS,i.cat)}</div><div><label class="lb">Цвет</label>${sel('fo',Object.keys(COLS),i.color)}</div></div>
  <div class="r2"><div><label class="lb">Сезон</label>${sel('fs',SEAS,i.season)}</div><div><label class="lb">Цена, ₸</label><input class="in" id="fp" type="number" inputmode="decimal" value="${i.price||''}"></div></div>
  <label class="lb">Бренд</label><input class="in" id="fb" value="${E(i.brand)}">
  <label class="lb">Теги через запятую</label><input class="in" id="ft" value="${E(i.tags.join(', '))}">
  <label class="lb">Заметки</label><textarea class="in" id="fz" rows="2">${E(i.notes)}</textarea>
  <div class="row" style="margin:14px 0"><label><input type="checkbox" id="ff"${i.fav?' checked':''}> Избранное</label><label><input type="checkbox" id="fl"${i.laundry?' checked':''}> В стирке</label></div>
  <div class="row"><button class="b" data-a="saveI" data-id="${id||''}">Сохранить</button><button class="b g" data-a="cl">Отмена</button>${id?`<button class="b g" data-a="delI" data-id="${id}">${I('trash',16)}Удалить</button>`:''}</div>`);
}
function saveItem(id){
  const name=$('#fn').value.trim();if(!name)return toast('Введите название вещи');
  const p=parseFloat($('#fp').value);
  const d={name,cat:$('#fc').value,color:$('#fo').value,season:$('#fs').value,price:p>0?p:null,brand:$('#fb').value.trim(),tags:$('#ft').value.split(',').map(x=>x.trim()).filter(Boolean),notes:$('#fz').value.trim(),fav:$('#ff').checked,laundry:$('#fl').checked,photo:PH};
  if(id)Object.assign(gI(id),d);else S.items.push({id:uid(),wears:0,created:Date.now(),...d});
  G=null;save();closeM();render();toast('Вещь сохранена');
}
function openOutfit(id){
  const o=id?S.outfits.find(x=>x.id===id):{name:'',ids:[]};
  const cur=s=>(o.ids.map(gI).find(i=>i&&slotOf(i.cat)===s)||{}).id;
  modal(`<h2>${id?'Изменить образ':'Новый образ'}</h2><label class="lb">Название</label><input class="in" id="on" value="${E(o.name)}" placeholder="Например, рабочий день">
  ${SLOTS.map(s=>`<label class="lb">${SN[s]}</label><select class="in" id="sl-${s}"><option value="">Не выбрано</option>${S.items.filter(i=>slotOf(i.cat)===s).map(i=>`<option value="${i.id}"${i.id===cur(s)?' selected':''}>${E(i.name)}${i.laundry?' (в стирке)':''}</option>`).join('')}</select>`).join('')}
  <div class="row" style="margin-top:18px"><button class="b" data-a="saveO" data-id="${id||''}">Сохранить</button><button class="b g" data-a="cl">Отмена</button></div>`);
}
function saveOutfit(id){
  const ids=SLOTS.map(s=>$('#sl-'+s).value).filter(Boolean);
  const miss=['top','bottom','shoes'].filter(s=>!$('#sl-'+s).value);
  if(miss.length)return toast('Добавьте в образ: '+miss.map(s=>SN[s].toLowerCase()).join(', '));
  const name=$('#on').value.trim()||'Образ от '+new Date().toLocaleDateString('ru-RU');
  if(id){Object.assign(S.outfits.find(x=>x.id===id),{name,ids})}else S.outfits.unshift({id:uid(),name,ids,fav:false});
  save();closeM();render();toast('Образ сохранён');
}
function backup(){
  modal(`<h2>Резервная копия</h2><p class="sub">Скопируйте текст, чтобы сохранить данные, или вставьте ранее сохранённую копию и нажмите «Восстановить».</p><textarea class="in" id="bk" rows="8" style="margin:12px 0;font-size:12px">${E(JSON.stringify(S))}</textarea>
  <input type="file" accept=".json,.txt" id="bf" class="in" style="margin-bottom:12px"><div class="row"><button class="b" data-a="copy">Копировать</button><button class="b g" data-a="restore">Восстановить</button><button class="b g" data-a="cl">Закрыть</button></div>`);
}

/* ---------- События ---------- */
document.addEventListener('click',e=>{
  if(e.target.classList.contains('ov'))return closeM();
  const a=e.target.closest('[data-a]');if(!a)return;e.stopPropagation();
  const id=a.dataset.id,k=a.dataset.a;
  const d=wd(),c=G&&G.list&&G.list.length?G.list[G.idx%G.list.length]:null;
  const A={
    lg(){authModal(id)},swm(){authModal(AM==='up'?'in':'up')},sub:submit,gg:google,fg:forgot,out(){sync().then(()=>auth.signOut())},
    start(){const v=$('#nm').value.trim();if(!v)return toast('Введите имя');S.name=v;save();render();loadW()},
    go(){V=id;render();window.scrollTo(0,0)},
    cl:closeM,yes(){closeM();CB&&CB();CB=null},
    refresh(){loadW()},
    man(){const v=parseFloat($('#mt').value);if(isNaN(v))return toast('Введите число, например 12');MAN=v;G=null;render()},
    next(){G.idx++;render()},
    wearG(){c&&wear(c.items.map(i=>i.id))},
    saveG(){if(!c)return;S.outfits.unshift({id:uid(),name:'Образ от '+new Date().toLocaleDateString('ru-RU'),ids:c.items.map(i=>i.id),fav:false});save();toast('Образ сохранён')},
    add(){openItem()},edit(){openItem(id)},
    fav(){const i=gI(id);i.fav=!i.fav;G=null;save();$('#wl')?$('#wl').innerHTML=wlist():render()},
    vw(){W.view=W.view==='grid'?'list':'grid';render()},
    saveI(){saveItem(id)},
    delI(){ask('Удалить вещь? Она также исчезнет из сохранённых образов.',()=>{S.items=S.items.filter(x=>x.id!==id);S.outfits.forEach(o=>o.ids=o.ids.filter(x=>x!==id));G=null;save();render();toast('Вещь удалена')})},
    tab(){OT=id;render()},newO(){openOutfit()},editO(){openOutfit(id)},saveO(){saveOutfit(id)},
    favO(){const o=S.outfits.find(x=>x.id===id);o.fav=!o.fav;save();render()},
    wearO(){const o=S.outfits.find(x=>x.id===id);if(o.ids.some(x=>gI(x)&&gI(x).laundry))return toast('В образе есть вещь в стирке');wear(o.ids)},
    delO(){ask('Удалить образ?',()=>{S.outfits=S.outfits.filter(x=>x.id!==id);save();render()})},
    undo(){undo(id)},bk:backup,
    copy(){const t=$('#bk');t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('Скопировано')).catch(()=>{document.execCommand&&document.execCommand('copy');toast('Скопировано')})},
    restore(){try{const j=JSON.parse($('#bk').value);if(!Array.isArray(j.items))throw 0;ask('Текущие данные будут заменены. Продолжить?',()=>{S=migrate(j);G=null;save();applyTheme();render();toast('Данные восстановлены')})}catch(x){toast('Неверный формат резервной копии')}},
    reset(){ask('Удалить все вещи, образы и историю? Это действие нельзя отменить.',()=>{S={v:3,name:S.name,theme:S.theme,city:S.city,items:[],outfits:[],history:[]};G=null;save();render();toast('Данные удалены')})}
  };
  A[k]&&A[k]();
});
document.addEventListener('input',e=>{
  if(e.target.id==='wq'){W.q=e.target.value;$('#wl').innerHTML=wlist()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='wc'){W.cat=t.value;$('#wl').innerHTML=wlist()}
  else if(t.id==='ws'){W.sort=t.value;$('#wl').innerHTML=wlist()}
  else if(t.id==='sn'){S.name=t.value.trim()||S.name;save();toast('Имя сохранено')}
  else if(t.id==='st'){S.theme=t.value;applyTheme();save()}
  else if(t.id==='sc'){S.city=t.value==='auto'?'auto':+t.value;MAN=null;save();loadW()}
  else if(t.id==='fi'&&t.files[0]){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);PH=c.toDataURL('image/jpeg',.78);$('#pv').innerHTML=`<img class="ph" style="max-height:220px;width:auto;margin:auto" src="${PH}" alt="">`};im.onerror=()=>toast('Не удалось открыть изображение');im.src=r.result};r.readAsDataURL(t.files[0])}
  else if(t.id==='bf'&&t.files[0]){const r=new FileReader();r.onload=()=>{$('#bk').value=r.result};r.readAsText(t.files[0])}
});
setInterval(()=>{if(V==='today'&&S.name&&!$('#mo').innerHTML&&!document.activeElement.matches('input,textarea'))render()},60000);

/* ---------- Автообновление погоды ---------- */
const busy=()=>document.activeElement&&document.activeElement.matches('input,textarea,select');
setInterval(()=>{if(S.name&&MAN==null&&!busy())loadW()},18e5);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.name&&MAN==null&&!busy()&&(!WX||Date.now()-WX.at>12e5))loadW()});
/* ---------- Запуск ---------- */
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ap')submit()});
auth.onAuthStateChanged(async u=>{
  AU=u;OK=false;S=blank();SV={};G=null;WX=null;V='today';
  if(u){try{await loadUser()}catch(e){toast('Не удалось загрузить данные. Проверьте правила Firestore и сеть');OK=false}}
  AR=true;closeM();applyTheme();render();if(u&&S.name)loadW();
});
</script>
</body>
</html>
